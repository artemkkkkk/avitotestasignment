services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: avito_kitchen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d avito_kitchen"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrations:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://app:app@postgres:5432/avito_kitchen?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api-image
    environment:
      HTTP_ADDR: ":8080"
      DB_DSN: "postgres://app:app@postgres:5432/avito_kitchen?sslmode=disable"
      BASE_URL: "http://localhost:8080"
      ADMIN_TOKEN: "admin-token"
      SEED_DEMO: "true"
      DEMO_EXTERNAL_ID: "demo-pizza"
      DEMO_RESTAURANT_NAME: "Пицца Мама"
      DEMO_API_KEY: "demo-key"
      DEMO_WEBHOOK_SECRET: "demo-secret"
      DEMO_CONFIRMATION_URL: "http://restaurant-demo:8081/confirm-order"
      DEMO_WEBHOOK_URL: "http://restaurant-demo:8081/webhook/events"
      DEMO_DELIVERY_FEE_CENTS: "19900"
      DEMO_MIN_ORDER_CENTS: "10000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  restaurant-demo:
    build:
      context: .
      target: demo-image
    environment:
      CORE_BASE_URL: "http://api:8080"
      RESTAURANT_API_KEY: "demo-key"
      WEBHOOK_ADDR: ":8081"
      PUBLIC_BASE_URL: "http://restaurant-demo:8081"
      WEBHOOK_SECRET: "demo-secret"
      AUTO_CONFIRM: "true"
      SIMULATE_REJECT: "false"
      AUTO_PROCESS_PAID_ORDERS: "true"
    ports:
      - "8081:8081"
    depends_on:
      - api